<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tazas</title>
    <link rel="stylesheet" href="../../src/css/estilos.css" />
  </head>
  <body>
    <header class="encabezado">
      <img src="../../public/images/Bebidas/logo-starbucks.png" alt="Starbucks Logo" />
      <h1>Tazas</h1>
    </header>

    <main>
      <section class="producto-item">
        <h3>Taza Blanca Clásica</h3>
        <img src="../../public/images/souvenirs/tazaclas.png" alt="Taza Blanca Clásica" />
        <p class="precio">$280 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <section class="producto-item">
        <h3>Taza Azul Cristal Edición Limitada</h3>
        <img src="../../public/images/souvenirs/tazaazul.png" alt="Taza Azul Cristal" />
        <p class="precio">$340 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <section class="producto-item">
        <h3>Taza Acero Inoxidable</h3>
        <img src="../../public/images/souvenirs/tazaacero.png" alt="Taza Acero Inoxidable" />
        <p class="precio">$390 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <section class="producto-item">
        <h3>Taza España "Been There Series"</h3>
        <img src="../../public/images/souvenirs/tazaesp.png" alt="Taza España" />
        <p class="precio">$320 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <div class="contenedor-volver-index">
        <a href="../../index.html" class="btn-volver-index"
          >← Volver al Menú Principal</a
        >
      </div>
    </main>
    <script type="module" src="../../src/js/comprar-producto.mjs"></script>
  </body>
</html>

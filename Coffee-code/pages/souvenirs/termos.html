<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termos</title>
    <link rel="stylesheet" href="../../src/css/estilos.css" />
  </head>
  <body>
    <header class="encabezado">
      <img src="../../public/images/Bebidas/logo-starbucks.png" alt="Starbucks Logo" />
      <h1>Termos</h1>
    </header>

    <main>
      <section class="producto-item">
        <h3>Termo azul 600ml</h3>
        <img src="../../public/images/souvenirs/termoazul.png" alt="Termo Azul" />
        <p class="precio">$450 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <section class="producto-item">
        <h3>Termo Japón "Been There Series"</h3>
        <img src="../../public/images/souvenirs/termojapon.png" alt="Termo Japón" />
        <p class="precio">$520 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <section class="producto-item">
        <h3>Termo New Era Collection</h3>
        <img src="../../public/images/souvenirs/termonewera.png" alt="Termo New Era" />
        <p class="precio">$490 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <section class="producto-item">
        <h3>Termo México 20 años</h3>
        <img src="../../public/images/souvenirs/termomex.png" alt="Termo México" />
        <p class="precio">$480 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <div class="contenedor-volver-index">
        <a href="../../index.html" class="btn-volver-index"
          >← Volver al Menú Principal</a

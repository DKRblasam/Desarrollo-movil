<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vasos</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header class="encabezado">
      <img src="logo-starbucks.png" alt="Starbucks Logo" />
      <h1>Vasos</h1>
    </header>

    <main>
      <section class="producto-item">
        <h3>Vaso Reutilizable</h3>
        <img src="vasoreu.png" alt="Vaso Reutilizable" />
        <p class="precio">$120 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <section class="producto-item">
        <h3>Vaso Transparente</h3>
        <img src="vasotransp.png" alt="Vaso Transparente" />
        <p class="precio">$250 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <section class="producto-item">
        <h3>Vaso con Gema de Esmeralda</h3>
        <img src="vasoesme.png" alt="Vaso Esmeralda" />
        <p class="precio">$380 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <section class="producto-item">
        <h3>Vaso Holográfico</h3>
        <img src="vasoholo.png" alt="Vaso Holográfico" />
        <p class="precio">$350 MXN</p>
        <button class="btn-comprar">Comprar</button>
      </section>

      <div class="contenedor-volver-index">
        <a href="../../index.html" class="btn-volver-index"
          >← Volver al Menú Principal</a
        >
      </div>
    </main>
    <script type="module" src="comprar-producto.mjs"></script>
  </body>
</html>


<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Pedidos</title>
</head>

<body>

    <h1>Starbucks</h1>

    <h2>Pedidos</h2>

    <hr>

    <h3>Lista de pedidos</h3>

    <div id="listaPedidosCaja">
        <!-- Aquí aparecerán los pedidos -->
    </div>

    <h3 id="totalGeneralCaja">
        Total acumulado: $0 MXN
    </h3>


    <script type="module">

        import { iniciarCaja } from "./Caja.mjs";


        // Callback para notificar al cliente
        function notificarCliente(id, estado) {

            console.log(
                `El pedido #${id} ahora está ${estado}`
            );

        }


        // Iniciamos Caja pasando el callback
        iniciarCaja(notificarCliente);

    </script>

</body>

</html>
